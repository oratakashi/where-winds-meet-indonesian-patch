name: rust-ci

# Rust toolchain (rust/, the `wwm` binary): format, lint and unit/integration tests on
# Linux + Windows, then a parity run against the Python scripts on the real repo data
# (tools/parity_check.sh). Parity also runs when only the Python tools change, so the
# Python failsafe and the Rust port never drift apart.
on:
  pull_request:
    paths:
      - "rust/**"
      - "tools/**"
      - "wwm_locmap.py"
      - "cn/tools/**"
      - "translation_work/build_unique.py"
      - ".github/actions/wwm-toolchain/**"
      - ".github/workflows/rust-ci.yml"
  push:
    branches: [main]
    paths:
      - "rust/**"
      - "tools/**"
      - "wwm_locmap.py"
      - "cn/tools/**"
      - "translation_work/build_unique.py"
      - ".github/actions/wwm-toolchain/**"
      - ".github/workflows/rust-ci.yml"
  workflow_dispatch: {}

concurrency:
  group: rust-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked

  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Build wwm
        run: cargo build --release --locked --manifest-path rust/Cargo.toml
      - name: Rust vs Python on the repo data
        run: sh tools/parity_check.sh
