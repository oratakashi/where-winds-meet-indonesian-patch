name: release-app

# Builds WWM Patch Guard (app/): the Windows tray app that reinstalls the Indonesian patch
# when NetEase's patcher puts the original locale files back.
#
#   - push to main touching app/  -> test + build, installer kept as a workflow artifact
#   - tag app-v*                   -> the same, plus a GitHub release for that tag
#
# Separate from the patch releases (`latest`, `cn-latest`): the app only downloads those.
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/release-app.yml"
    tags: ["app-v*"]
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/release-app.yml"
  workflow_dispatch: {}

concurrency:
  group: release-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app

      - uses: taiki-e/install-action@v2
        with:
          tool: trunk,tauri-cli

      # The guard rules (what may be written over which file) are covered here.
      - name: Test
        run: cargo test -p wwm-patch-guard --lib

      - name: Build installer
        run: cargo tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: wwm-patch-guard-windows
          path: app/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/app-v')
        uses: softprops/action-gh-release@v2
        with:
          name: "WWM Patch Guard ${{ github.ref_name }}"
          make_latest: false
          files: app/target/release/bundle/nsis/*.exe
          body: |
            **WWM Patch Guard** — app Windows kecil (system tray) yang memasang kembali patch
            Bahasa Indonesia secara otomatis setiap kali patcher NetEase menimpa file bahasa
            dengan versi aslinya.

            Mendukung PC Official Launcher (global) dan client China. Cara pakai:
            [README — Patch Guard](https://github.com/oratakashi/where-winds-meet-indonesian-patch#auto-reinstall--wwm-patch-guard-windows).
