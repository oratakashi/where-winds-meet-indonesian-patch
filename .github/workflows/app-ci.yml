name: app-ci

# Tests + builds WWM Patch Guard (app/) on pull requests. Releases are no longer made
# here: on main the installer is built and attached to the rolling `latest` patch
# release by release-patch.yml (only when app/ changed).

on:
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/app-ci.yml"
  workflow_dispatch: {}

concurrency:
  group: app-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: app

      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-packager@0.11.8

      # The guard rules (what may be written over which file) are covered here.
      - name: Test
        run: cargo test -p wwm-patch-guard --lib

      # Native GPUI app (no WebView2): cargo-packager builds the release exe and wraps it in
      # an NSIS installer (config: [package.metadata.packager] in app/Cargo.toml).
      - name: Build installer
        run: cargo packager --release --formats nsis

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wwm-patch-guard-windows
          path: app/target/release/bundle/*-setup.exe
          if-no-files-found: error
