name: translation-qa

# Every translation session must leave locale/*.jsonl valid and the generated
# progress block in Obsidian-Vault/progress/Current-Status.md up to date.
# WWM China (cn/) has its own workflow: translation-qa-cn.yml.
on:
  pull_request:
    paths:
      - "locale/**"
      - "translation_work/**"
      - "translate_words_map_en"
      - "translate_words_map_en_diff"
      - "tools/**"
      - "Obsidian-Vault/progress/Current-Status.md"
      - ".github/workflows/translation-qa.yml"
  push:
    branches: [main]
    paths:
      - "locale/**"
      - "translation_work/**"
      - "translate_words_map_en"
      - "translate_words_map_en_diff"
      - "tools/**"
      - "Obsidian-Vault/progress/Current-Status.md"
      - ".github/workflows/translation-qa.yml"

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Validate translation files
        run: python tools/qa_check.py --locale "locale/*.jsonl"
      # strings.jsonl tidak ter-track (>100 MB sejak v2.3) — dump dari binary.
      - name: Dump strings.jsonl
        run: python wwm_locmap.py dump translate_words_map_en strings.jsonl
      # Sejak hotfix v2.3 coverage _diff juga masuk blok progress.
      - name: Dump strings_diff.jsonl
        run: python wwm_locmap.py dump translate_words_map_en_diff strings_diff.jsonl
      - name: Progress block is up to date
        run: python tools/progress.py --check
