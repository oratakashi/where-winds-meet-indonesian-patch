name: translation-qa

# Every translation session must leave locale/*.jsonl valid and the generated
# progress block in Obsidian-Vault/progress/Current-Status.md up to date — and the
# same for the WWM China profile (cn/locale/, Obsidian-Vault/cn/progress/CN-Current-Status.md).
# The cn checks need no dump: cn coverage comes from the `freq` column, because dumping
# the CN files needs the (untracked) dictionary keystream.
on:
  pull_request:
    paths:
      - "locale/**"
      - "translation_work/**"
      - "translate_words_map_en"
      - "translate_words_map_en_diff"
      - "tools/**"
      - "Obsidian-Vault/progress/Current-Status.md"
      - "cn/locale/**"
      - "cn/translation_work/**"
      - "cn/overrides.jsonl"
      - "Obsidian-Vault/cn/progress/CN-Current-Status.md"
  push:
    branches: [main]
    paths:
      - "locale/**"
      - "translation_work/**"
      - "translate_words_map_en"
      - "translate_words_map_en_diff"
      - "tools/**"
      - "Obsidian-Vault/progress/Current-Status.md"
      - "cn/locale/**"
      - "cn/translation_work/**"
      - "cn/overrides.jsonl"
      - "Obsidian-Vault/cn/progress/CN-Current-Status.md"

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Validate translation files
        run: python tools/qa_check.py --locale "locale/*.jsonl"
      # strings.jsonl tidak ter-track (>100 MB sejak v2.3) — dump dari binary.
      - name: Dump strings.jsonl
        run: python wwm_locmap.py dump translate_words_map_en strings.jsonl
      # Sejak hotfix v2.3 coverage _diff juga masuk blok progress.
      - name: Dump strings_diff.jsonl
        run: python wwm_locmap.py dump translate_words_map_en_diff strings_diff.jsonl
      - name: Progress block is up to date
        run: python tools/progress.py --check
      - name: Validate CN translation files
        run: python tools/qa_check.py --profile cn --locale "cn/locale/*.jsonl"
      - name: CN progress block is up to date
        run: python tools/progress.py --profile cn --check
