name: release-patch

# Membangun ulang file translate_words_map_* hasil terjemahan setiap push ke main,
# lalu mempublikasikannya sebagai satu GitHub Release "rolling" (tag tetap: latest)
# supaya pemain punya SATU link download yang selalu berisi build terbaru.
# Target: game v2.4 [Across Autumn Waters] — hanya translate_words_map_en + _diff
# (__small/__small_diff sudah tidak dikirim NetEase sejak v2.3). v2.4 mengubah base dan _diff.
#
# Attachment release `latest` (selain ini dihapus tiap rilis):
#   - wwm-indonesian-patch.zip  -> semua file patched (flat)
#   - manifest.json             -> hash original/patched per file + hash zip (dibaca Patch Guard)
#   - wwm-patch-guard-setup.exe -> installer Patch Guard (app/); hanya di-build ulang kalau
#                                  app/ berubah (atau dispatch dengan build_app), kalau tidak
#                                  installer yang sudah ada di release dibiarkan.
#
# Tooling: binary Rust `wwm` (default, di-cache per hash source rust/) dengan script Python
# sebagai failsafe — lihat .github/actions/wwm-toolchain dan docs/Rust-Toolchain.md.
on:
  push:
    branches: [main]
    paths:
      - "locale/**"
      - "translation_work/**"
      - "translate_words_map_en*"
      - "tools/**"
      - "rust/**"
      - "wwm_locmap.py"
      - "app/**"
      - ".github/actions/wwm-toolchain/**"
      - ".github/workflows/release-patch.yml"
  workflow_dispatch:
    inputs:
      build_app:
        description: "Build ulang installer Patch Guard"
        type: boolean
        default: false
      toolchain:
        description: "Tooling: auto (repo variable WWM_TOOLCHAIN, else rust), rust, python"
        type: choice
        options: [auto, rust, python]
        default: auto

# Kalau ada beberapa push beruntun dalam waktu singkat (10x/hari), cukup build
# yang paling terakhir yang perlu selesai — batalkan run lama yang masih antre.
concurrency:
  group: release-patch
  cancel-in-progress: true

env:
  ZIP: wwm-indonesian-patch.zip
  APP_EXE: wwm-patch-guard-setup.exe

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app == 'true' || inputs.build_app == true }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app:
              - "app/**"

  build-app:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app

      - uses: taiki-e/install-action@v2
        with:
          tool: trunk,tauri-cli

      # The guard rules (what may be written over which file) are covered here.
      - name: Test
        run: cargo test -p wwm-patch-guard --lib

      - name: Build installer
        run: cargo tauri build

      # Nama tetap supaya README bisa link langsung ke releases/download/latest/<nama>.
      - name: Rename installer
        shell: bash
        run: |
          set -- target/release/bundle/nsis/*.exe
          [ "$#" -eq 1 ] || { echo "::error::expected one NSIS installer, got $#"; exit 1; }
          cp "$1" "$APP_EXE"

      - uses: actions/upload-artifact@v4
        with:
          name: wwm-patch-guard-windows
          path: app/${{ env.APP_EXE }}
          if-no-files-found: error

  build-and-release:
    needs: [changes, build-app]
    # build-app dilewati (app tidak berubah) = tetap rilis; build-app gagal = jangan rilis.
    if: always() && needs.changes.result == 'success' && (needs.build-app.result == 'success' || needs.build-app.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Rust `wwm` (default) or the Python scripts (repo variable WWM_TOOLCHAIN=python,
      # the dispatch input, or automatically when the Rust build fails). Every step
      # below goes through tools/wwm.sh, which runs whichever was selected.
      - uses: ./.github/actions/wwm-toolchain
        id: tc
        with:
          toolchain: ${{ (inputs.toolchain != 'auto' && inputs.toolchain) || vars.WWM_TOOLCHAIN || 'rust' }}

      - name: Build patched files
        run: sh tools/wwm.sh patch-all --outdir patched --level 19

      # Menulis zip rilis (hanya file patched, flat — Patch Guard mengambil file dari zip
      # ini berdasarkan nama) + manifest.json berisi hash original/patched per file dan
      # hash zip; app memakai manifest untuk tahu apakah build cocok dengan file game.
      - name: Write zip + manifest.json
        run: sh tools/wwm.sh manifest --outdir patched --archive "$ZIP"

      # strings.jsonl tidak ter-track (>100 MB sejak v2.3) — Python butuh dump dari binary
      # (blok progress juga memuat coverage _diff sejak hotfix v2.3); Rust men-decode
      # binary langsung.
      - name: Dump strings.jsonl + strings_diff.jsonl (Python only)
        if: steps.tc.outputs.toolchain == 'python'
        run: |
          sh tools/wwm.sh dump translate_words_map_en strings.jsonl
          sh tools/wwm.sh dump translate_words_map_en_diff strings_diff.jsonl

      - name: Compute progress summary
        id: progress
        run: |
          {
            echo "line<<EOF"
            sh tools/wwm.sh progress
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Download Patch Guard installer
        if: needs.build-app.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: wwm-patch-guard-windows
          path: app-dist

      - name: Patch Guard version
        id: app
        run: echo "version=$(jq -r .version app/src-tauri/tauri.conf.json)" >> "$GITHUB_OUTPUT"

      - name: Publish rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Patch Terjemahan Indonesia — WWM v2.4 Across Autumn Waters (build terbaru)"
          make_latest: "true"
          target_commitish: ${{ github.sha }}
          body: |
            Build otomatis dari commit ${{ github.sha }} (${{ github.event.head_commit.timestamp }}).

            **Untuk Where Winds Meet versi 2.4 [Across Autumn Waters].** Download
            **`wwm-indonesian-patch.zip`** lalu ekstrak — isinya `translate_words_map_en` dan
            `translate_words_map_en_diff`. v2.4 memperbarui keduanya, jadi pastikan kedua file
            disalin ulang. String baru v2.4 masih dalam proses diterjemahkan. File `__small` /
            `__small_diff` sudah tidak ada sejak v2.3, jadi tidak perlu disalin lagi.

            Ini adalah build **terbaru dari `main`**, bukan rilis stabil — progress terjemahan
            masih berjalan. File di release ini selalu ter-overwrite tiap kali ada perubahan
            terjemahan yang di-push ke `main`.

            ${{ steps.progress.outputs.line }}

            > [!NOTE]
            > Cara pakai: lihat [`README.md`](https://github.com/oratakashi/where-winds-meet-indonesian-patch#player-installation-guide) repo untuk petunjuk instalasi ke folder game.

            ### WWM Patch Guard (Windows) — v${{ steps.app.outputs.version }}

            Patcher NetEase mengembalikan file bahasa asli setiap ada update game. **`wwm-patch-guard-setup.exe`**
            adalah app kecil (system tray) yang memasang ulang patch ini secara otomatis — tidak perlu
            download dan menyalin zip manual. Panduan:
            [README — Patch Guard](https://github.com/oratakashi/where-winds-meet-indonesian-patch#auto-reinstall--wwm-patch-guard-windows).
            Patch Guard versi lama (sebelum 0.3.0) tidak bisa membaca rilis ini — install ulang dari sini.

            ---

            ## Support & Donation

            This Indonesian patch is, and will always remain, **free for everyone**. Keeping it accurate and playable, however, comes with real ongoing costs:

            - **AI translation costs** — Translating several hundred thousand strings with AI assistance consumes a substantial volume of tokens, and quality AI is not inexpensive.
            - **Mod maintenance** — Every NetEase update changes the locale files. Each release means re-extracting the data, translating new and changed text, running quality checks, and republishing the patch so it continues to work in-game.
            - **Time and dedication** — All of this work is carried out by a single maintainer.

            If this project has made Where Winds Meet more enjoyable for you, please consider supporting its development. Every contribution, regardless of size, goes directly toward AI costs and toward keeping the patch current after each game update. Your support is what keeps this project alive, and it is sincerely appreciated.

            Unable to donate? You can still make a meaningful difference by starring the repository, sharing it with fellow players, or reporting inaccurate translations through Issues.

            ![QR](https://raw.githubusercontent.com/oratakashi/where-winds-meet-indonesian-patch/main/.donation/saweria.png)

            **Donate via Saweria:** [https://saweria.co/oratakashi](https://saweria.co/oratakashi)
          files: |
            ${{ env.ZIP }}
            patched/manifest.json
            app-dist/${{ env.APP_EXE }}

      # softprops tidak menghapus asset lama: buang semua yang bukan zip/manifest/installer
      # (mis. file translate_words_map_* mentah dari rilis sebelumnya).
      - name: Remove stale release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest --json assets --jq '.assets[].name' | while read -r name; do
            case "$name" in
              "$ZIP"|manifest.json|"$APP_EXE") ;;
              *) echo "deleting $name"; gh release delete-asset latest "$name" --yes ;;
            esac
          done
          if ! gh release view latest --json assets --jq '.assets[].name' | grep -qx "$APP_EXE"; then
            echo "::warning::release latest has no $APP_EXE yet — run this workflow with build_app"
          fi
