name: release-patch

# Membangun ulang file translate_words_map_* hasil terjemahan setiap push ke main,
# lalu mempublikasikannya sebagai satu GitHub Release "rolling" (tag tetap: latest)
# supaya pemain punya SATU link download yang selalu berisi build terbaru.
# Target: game v2.4 [Across Autumn Waters] — hanya translate_words_map_en + _diff
# (__small/__small_diff sudah tidak dikirim NetEase sejak v2.3). v2.4 mengubah base dan _diff.
# Update tambahan v2.4 (2026-11-26) hanya mengubah _diff (blok Update-3H).
#
# Attachment release `latest` (selain ini dihapus tiap rilis):
#   - wwm-indonesian-patch.zip  -> semua file patched (flat)
#   - manifest.json             -> hash original/patched per file + hash zip (dibaca Patch Guard)
#   - manifest.json.sig         -> tanda tangan minisign manifest.json (Patch Guard >= 0.5 menolak
#                                  manifest tanpa tanda tangan yang valid)
#   - wwm-patch-guard-setup.exe -> installer Patch Guard (app/); hanya di-build ulang kalau
#                                  app/ berubah (atau dispatch dengan build_app), kalau tidak
#                                  installer yang sudah ada di release dibiarkan. Begitu juga:
#   - wwm-patch-guard-setup.exe.sig, patch-guard-update.json(.sig)
#                               -> auto-update Patch Guard (versi, sha256, ukuran, tanda tangan)
#
# Alur job (kunci tanda tangan hanya ada di job `sign`):
#   changes -> build-app (opsional, windows, TANPA secret) ─┐
#           -> build-patch (ubuntu, TANPA secret) ──────────┴-> sign (environment `release`)
#                                                              -> publish (contents: write)
# Job `sign` tidak checkout repo dan tidak memakai cache: ia hanya menerima artifact hasil
# build, jadi build.rs / dependency / tools repo tidak pernah berjalan di job yang memegang
# kunci. Trusted comment tiap .sig (`timestamp:<unix>\tfile:<nama>`, ditulis cargo-packager)
# dicek Patch Guard >= 0.6.1: nama file harus cocok, dan manifest tidak boleh lebih tua dari
# yang sudah pernah dipakai (anti-rollback).
#
# Tanda tangan: secret PATCH_GUARD_SIGN_KEY (private key `cargo packager signer generate`,
# isi file-nya) + PATCH_GUARD_SIGN_KEY_PASSWORD (opsional: jangan dibuat kalau key tanpa
# password). Simpan keduanya sebagai secret ENVIRONMENT `release` (Settings → Environments →
# release: deployment branch hanya `main`, opsional required reviewer), bukan secret repo.
# Public key-nya (aktif + cadangan) ada di app/signing/. Lihat Obsidian-Vault/knowladge/Patch-Guard.md
# (bagian "Signing keys") untuk rotasi dan pencabutan.
#
# Tooling: binary Rust `wwm` (default, di-cache per hash source rust/) dengan script Python
# sebagai failsafe — lihat .github/actions/wwm-toolchain dan docs/Rust-Toolchain.md.
on:
  push:
    branches: [main]
    paths:
      - "locale/**"
      - "translation_work/**"
      - "translate_words_map_en*"
      - "tools/**"
      - "rust/**"
      - "wwm_locmap.py"
      - "app/**"
      - ".github/actions/wwm-toolchain/**"
      - ".github/workflows/release-patch.yml"
  workflow_dispatch:
    inputs:
      build_app:
        description: "Build ulang installer Patch Guard"
        type: boolean
        default: false
      toolchain:
        description: "Tooling: auto (repo variable WWM_TOOLCHAIN, else rust), rust, python"
        type: choice
        options: [auto, rust, python]
        default: auto

# Run beruntun antre satu per satu: run yang sedang mengunggah asset tidak boleh
# dibatalkan di tengah jalan (bisa meninggalkan zip baru dengan manifest lama). GitHub
# hanya menyimpan SATU run yang menunggu per grup, jadi push beruntun tetap berakhir
# di build terbaru.
concurrency:
  group: release-patch
  cancel-in-progress: false

env:
  ZIP: wwm-indonesian-patch.zip
  APP_EXE: wwm-patch-guard-setup.exe
  APP_UPDATE: patch-guard-update.json
  # Versi pasti: binary ini yang memegang kunci tanda tangan. Naikkan dengan sengaja.
  CARGO_PACKAGER: cargo-packager@0.11.8

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app == 'true' || inputs.build_app == true }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            app:
              - "app/**"

  build-app:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: app

      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: ${{ env.CARGO_PACKAGER }}

      # The guard rules (what may be written over which file) are covered here.
      - name: Test
        run: cargo test -p wwm-patch-guard --lib

      # Native GPUI app (no WebView2): cargo-packager builds the release exe and wraps it in
      # an NSIS installer (config: [package.metadata.packager] in app/Cargo.toml).
      - name: Build installer
        run: cargo packager --release --formats nsis

      # Nama tetap supaya README bisa link langsung ke releases/download/latest/<nama>.
      - name: Rename installer
        shell: bash
        run: |
          set -- target/release/bundle/*-setup.exe
          [ "$#" -eq 1 ] || { echo "::error::expected one NSIS installer, got $#"; exit 1; }
          cp "$1" "$APP_EXE"

      - name: Version
        id: version
        shell: bash
        run: echo "version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)" >> "$GITHUB_OUTPUT"

      # Belum ditandatangani: job `sign` yang melakukannya.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-unsigned
          path: app/${{ env.APP_EXE }}
          if-no-files-found: error

  build-patch:
    needs: changes
    runs-on: ubuntu-latest
    outputs:
      progress: ${{ steps.progress.outputs.line }}
      app_version: ${{ steps.app.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Rust `wwm` (default) or the Python scripts (repo variable WWM_TOOLCHAIN=python,
      # the dispatch input, or automatically when the Rust build fails). Every step
      # below goes through tools/wwm.sh, which runs whichever was selected.
      - uses: ./.github/actions/wwm-toolchain
        id: tc
        with:
          toolchain: ${{ (inputs.toolchain != 'auto' && inputs.toolchain) || vars.WWM_TOOLCHAIN || 'rust' }}

      # Gate QA: sama dengan translation-qa.yml. Gagal di sini = job ini gagal, jadi `sign`
      # dan `publish` tidak berjalan dan release `latest` tidak berubah.
      - name: Validate translation files
        run: sh tools/wwm.sh qa --locale "locale/*.jsonl"

      # strings.jsonl tidak ter-track (>100 MB sejak v2.3) — Python butuh dump dari binary
      # (blok progress juga memuat coverage _diff sejak hotfix v2.3); Rust men-decode
      # binary langsung.
      - name: Dump strings.jsonl + strings_diff.jsonl (Python only)
        if: steps.tc.outputs.toolchain == 'python'
        run: |
          sh tools/wwm.sh dump translate_words_map_en strings.jsonl
          sh tools/wwm.sh dump translate_words_map_en_diff strings_diff.jsonl

      - name: Progress block is up to date
        run: sh tools/wwm.sh progress --check

      - name: Build patched files
        run: sh tools/wwm.sh patch-all --outdir patched --level 19

      # Menulis zip rilis (hanya file patched, flat — Patch Guard mengambil file dari zip
      # ini berdasarkan nama) + manifest.json berisi hash original/patched per file dan
      # hash zip; app memakai manifest untuk tahu apakah build cocok dengan file game.
      - name: Write zip + manifest.json
        run: sh tools/wwm.sh manifest --outdir patched --archive "$ZIP"

      - name: Compute progress summary
        id: progress
        # Delimiter acak: output yang kebetulan memuat baris delimiter tidak bisa
        # menutup blok lebih awal dan menyuntik output lain.
        run: |
          d="EOF_$(openssl rand -hex 16)"
          {
            echo "line<<$d"
            sh tools/wwm.sh progress
            echo "$d"
          } >> "$GITHUB_OUTPUT"

      - name: Patch Guard version
        id: app
        run: echo "version=$(sed -n 's/^version = "\(.*\)"/\1/p' app/Cargo.toml | head -n1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: patch-unsigned
          path: |
            ${{ env.ZIP }}
            patched/manifest.json
          if-no-files-found: error

  # Satu-satunya job yang memegang kunci. Tanpa checkout, tanpa cache, tanpa kode repo.
  sign:
    needs: [changes, build-app, build-patch]
    # build-app dilewati (app tidak berubah) = tetap rilis; build-app gagal = jangan rilis.
    if: always() && needs.build-patch.result == 'success' && (needs.build-app.result == 'success' || needs.build-app.result == 'skipped')
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: patch-unsigned
          path: out

      - name: Download Patch Guard installer
        if: needs.build-app.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app-unsigned
          path: out

      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: ${{ env.CARGO_PACKAGER }}

      # Kunci lewat environment variable (dibaca cargo-packager sendiri), bukan argumen
      # command line yang terlihat di daftar proses.
      - name: Sign manifest.json (+ installer and update info)
        working-directory: out
        env:
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.PATCH_GUARD_SIGN_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.PATCH_GUARD_SIGN_KEY_PASSWORD }}
          VERSION: ${{ needs.build-app.outputs.version }}
        run: |
          [ -n "$CARGO_PACKAGER_SIGN_PRIVATE_KEY" ] || { echo "::error::secret PATCH_GUARD_SIGN_KEY belum di-set (environment release)"; exit 1; }
          cargo packager signer sign patched/manifest.json
          if [ -f "$APP_EXE" ]; then
            [ -n "$VERSION" ] || { echo "::error::versi Patch Guard tidak diketahui"; exit 1; }
            cargo packager signer sign "$APP_EXE"
            python3 - <<'PY'
          import hashlib, json, os, datetime
          exe = os.environ["APP_EXE"]
          data = open(exe, "rb").read()
          info = {
              "version": os.environ["VERSION"],
              "name": exe,
              "sha256": hashlib.sha256(data).hexdigest(),
              "size": len(data),
              "signature": open(exe + ".sig").read().strip(),
              "notes": "",
              "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
          }
          open(os.environ["APP_UPDATE"], "w").write(json.dumps(info, indent=2) + "\n")
          PY
            cargo packager signer sign "$APP_UPDATE"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-signed
          path: out/
          if-no-files-found: error

  publish:
    needs: [build-app, build-patch, sign]
    if: always() && needs.sign.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-signed
          path: dist

      - name: Publish rolling release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: latest
          name: "Patch Terjemahan Indonesia — WWM v2.4 Across Autumn Waters (build terbaru)"
          make_latest: "true"
          target_commitish: ${{ github.sha }}
          body: |
            Build otomatis dari commit ${{ github.sha }} (${{ github.event.head_commit.timestamp }}).

            **Untuk Where Winds Meet versi 2.4 [Across Autumn Waters].** Download
            **`wwm-indonesian-patch.zip`** lalu ekstrak — isinya `translate_words_map_en` dan
            `translate_words_map_en_diff`. v2.4 memperbarui keduanya, jadi pastikan kedua file
            disalin ulang. Update tambahan v2.4 (26 November 2026) hanya mengubah `_diff`, dan teks
            barunya sudah diterjemahkan. File `__small` /
            `__small_diff` sudah tidak ada sejak v2.3, jadi tidak perlu disalin lagi.

            Ini adalah build **terbaru dari `main`** (rolling release). File di release ini selalu
            ter-overwrite tiap kali ada perbaikan terjemahan yang di-push ke `main`.

            ${{ needs.build-patch.outputs.progress }}

            > [!NOTE]
            > Cara pakai: lihat [`README.md`](https://github.com/oratakashi/where-winds-meet-indonesian-patch#player-installation-guide) repo untuk petunjuk instalasi ke folder game.

            ### WWM Patch Guard (Windows) — v${{ needs.build-patch.outputs.app_version }}

            Patcher NetEase mengembalikan file bahasa asli setiap ada update game. **`wwm-patch-guard-setup.exe`**
            adalah app kecil (system tray) yang memasang ulang patch ini secara otomatis — tidak perlu
            download dan menyalin zip manual. Panduan:
            [README — Patch Guard](https://github.com/oratakashi/where-winds-meet-indonesian-patch#auto-reinstall--wwm-patch-guard-windows).
            Sejak **v0.5.0** Patch Guard memperbarui dirinya sendiri (unduh di latar belakang, lalu
            "Restart sekarang") dan hanya membaca rilis yang ditandatangani. **Versi 0.4.x ke bawah
            tidak bisa membaca rilis ini — install ulang sekali dari sini**; setelah itu update
            berikutnya otomatis.

            ---

            ## Support & Donation

            This Indonesian patch is, and will always remain, **free for everyone**. Keeping it accurate and playable, however, comes with real ongoing costs:

            - **AI translation costs** — Translating several hundred thousand strings with AI assistance consumes a substantial volume of tokens, and quality AI is not inexpensive.
            - **Mod maintenance** — Every NetEase update changes the locale files. Each release means re-extracting the data, translating new and changed text, running quality checks, and republishing the patch so it continues to work in-game.
            - **Time and dedication** — All of this work is carried out by a single maintainer.

            If this project has made Where Winds Meet more enjoyable for you, please consider supporting its development. Every contribution, regardless of size, goes directly toward AI costs and toward keeping the patch current after each game update. Your support is what keeps this project alive, and it is sincerely appreciated.

            Unable to donate? You can still make a meaningful difference by starring the repository, sharing it with fellow players, or reporting inaccurate translations through Issues.

            ![QR](https://raw.githubusercontent.com/oratakashi/where-winds-meet-indonesian-patch/main/.donation/saweria.png)

            **Donate via Saweria:** [https://saweria.co/oratakashi](https://saweria.co/oratakashi)
          files: |
            dist/${{ env.ZIP }}
            dist/patched/manifest.json
            dist/patched/manifest.json.sig
            dist/${{ env.APP_EXE }}
            dist/${{ env.APP_EXE }}.sig
            dist/${{ env.APP_UPDATE }}
            dist/${{ env.APP_UPDATE }}.sig

      # softprops tidak menghapus asset lama: buang semua yang bukan zip/manifest/installer/
      # file auto-update (mis. file translate_words_map_* mentah dari rilis sebelumnya).
      - name: Remove stale release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view latest --json assets --jq '.assets[].name' | while read -r name; do
            case "$name" in
              "$ZIP"|manifest.json|manifest.json.sig|"$APP_EXE"|"$APP_EXE.sig"|"$APP_UPDATE"|"$APP_UPDATE.sig") ;;
              *) echo "deleting $name"; gh release delete-asset latest "$name" --yes ;;
            esac
          done
          if ! gh release view latest --json assets --jq '.assets[].name' | grep -qx "$APP_EXE"; then
            echo "::warning::release latest has no $APP_EXE yet — run this workflow with build_app"
          fi
          if ! gh release view latest --json assets --jq '.assets[].name' | grep -qx "$APP_UPDATE"; then
            echo "::warning::release latest has no $APP_UPDATE yet (Patch Guard auto-update) — run this workflow with build_app"
          fi
