# Every third-party action is pinned to a full commit SHA (with the release tag as a comment).
# Dependabot keeps those pins current: one grouped PR per month, reviewed like any other change.
version: 2
updates:
  - package-ecosystem: github-actions
    # "/" covers .github/workflows/ and the local composite action in .github/actions/.
    directories:
      - "/"
      - "/.github/actions/wwm-toolchain"
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
