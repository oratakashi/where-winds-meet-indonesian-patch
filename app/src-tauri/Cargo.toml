[package]
name = "wwm-patch-guard"
version = "0.1.0"
description = "Keeps the Where Winds Meet Indonesian patch installed after NetEase's patcher restores the original locale files"
authors = ["oratakashi"]
license = "GPL-3.0-or-later"
edition = "2024"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (cargo#8519 on Windows).
name = "wwm_patch_guard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
notify = "8"
ureq = "2"

[dev-dependencies]
tempfile = "3"
