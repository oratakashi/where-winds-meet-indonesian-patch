[package]
name = "wwm-patch-guard-ui"
version = "0.1.0"
edition = "2024"

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1.7"
# Rust/UI (https://leptos.rust-ui.com) component runtime
leptos_ui = "0.3"
tw_merge = { version = "0.1", features = ["variant"] }

[workspace]
members = ["src-tauri"]

# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
